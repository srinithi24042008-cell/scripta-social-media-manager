<head>

  <meta property="og:image:alt" content="Scripta — AI Social Media Management Platform" />

  <!-- ── Twitter / X Card ────────────────────────────────────── -->

  <!-- ── PWA / Manifest / Favicon ────────────────────────────── -->
  <link rel="manifest" href="/manifest.json" />
  <!-- Fixed: was image/svg+xml but logo.png is a PNG -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Scripta" />

  <!-- ── DNS Prefetch & Preconnect ──────────────────────────── -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ── Preload Critical LCP Asset ─────────────────────────── -->
  <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />

  <!-- ── Asynchronous Non-Render-Blocking Google Fonts ───────── -->
  <!-- Trimmed to 3 essential families only (Inter: UI, Sora: brand/display, IBM Plex Mono: code) -->
  <!-- display=optional: browser won't wait for font if it isn't cached —
       eliminates both the 1,060ms LCP element render delay and the 0.006 CLS
       caused by the late WOFF2 swap. On repeat visits the font is cached and
       shows instantly. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=optional"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=optional" />
  </noscript>

  <!-- ── JSON-LD Structured Data (SoftwareApp, Org, WebSite, Breadcrumbs) ── -->

  <script type="application/ld+json">

    },

      }

    }
  }
  </script>
