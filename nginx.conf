server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Vite Hashed Assets — Long-Term Immutable Cache ─────────────
    # All files in /assets/ have content hashes in their filenames,
    # so they are safe to cache indefinitely in browsers and CDNs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Static Public Files — Short-term Cache ─────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── SEO / Meta Files — Revalidation Cache ─────────────────────
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
        access_log off;
    }

    # ── SPA Fallback — Client-Side Routing ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # HTML must not be cached so users always get the latest app shell
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Reverse-Proxy API/Media calls to the backend service ──────
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO — Realtime Notifications ────────────────────────
    # Upgrade/Connection headers forwarded for WebSocket handshake.
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
